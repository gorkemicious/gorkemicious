# AI PULSE — haber güncelleme + GitHub Pages yayını (OTOMATİK ÇALIŞMA KAPALI)
#
# Ne yapar?
#  1. agent.py'yi çalıştırır (haberleri toplar + Türkçe çevirir)
#  2. Güncel verileri repoya commitler
#  3. ai-news-agent/ klasörünü GitHub Pages'e yayınlar
#
# ⏸ OTOMATİK ÇALIŞMA DURDURULDU:
#  - Zamanlanmış (cron) ve push tetikleyicileri kaldırıldı.
#  - Site en son yayınlanan haliyle kalır; kendiliğinden güncellenmez.
#
# ▶ Yeniden başlatmak istersen iki yol var:
#  1) Bir kez elle çalıştır: GitHub → Actions → "AI PULSE Güncelle" → "Run workflow".
#  2) Otomatiğe geri al: 'on:' altına aşağıdaki bloğu geri ekle:
#       schedule:
#         - cron: "0 5,11,17 * * *"   # TSİ 08:00 / 14:00 / 20:00
#       push:
#         branches: ["claude/production-dashboard-kpi-kzAZB"]
#         paths: ["ai-news-agent/**", ".github/workflows/ai-pulse.yml"]

name: AI PULSE Güncelle

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-pulse
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: pip install requests anthropic

      - name: Haberleri topla (+ Türkçe çeviri, API anahtarı varsa)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ai-news-agent/agent.py --days 7 --limit 80

      - name: Güncel veriyi commitle
        run: |
          git config user.name "ai-pulse-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai-news-agent/data
          git diff --cached --quiet || git commit -m "chore: AI PULSE haber verilerini güncelle [skip ci]"
          git push

      - name: Pages'i etkinleştir
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages paketini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-news-agent

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Pages ara sıra geçici "try again later" hatası veriyor; bekleyip bir kez daha dene
      - name: Bekle (geçici Pages hatası)
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: GitHub Pages'e yayınla (2. deneme)
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
