<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Fransızca A1 · Sıfırdan Sisteme</title>
<style>
:root{
  --bg:#0B1220; --card:#131C2E; --card2:#0F1725; --line:#22304A;
  --cyan:#22D3EE; --purple:#A78BFA; --ok:#34D399; --bad:#F87171;
  --txt:#E6EDF7; --mut:#8CA0BD; --dim:#5C6E8A; --warn:#FBBF24;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.mono{font-family:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
button{font-family:inherit; cursor:pointer}
a{color:var(--cyan)}
::selection{background:rgba(34,211,238,.25)}

/* Layout */
#app{display:flex; min-height:100vh}
#sidebar{
  width:290px; flex:0 0 290px; background:var(--card2); border-right:1px solid var(--line);
  padding:16px 12px 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#main{flex:1; min-width:0; padding:20px clamp(14px,4vw,44px) 120px; max-width:960px; margin:0 auto}
.brand{display:flex; align-items:center; gap:10px; padding:6px 8px 14px}
.brand b{font-size:18px; letter-spacing:.3px}
.brand .fl{font-size:22px}
.brand small{color:var(--mut); font-weight:400; display:block; font-size:11px}

/* Sidebar nav */
.navsec{margin:10px 4px 6px; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--dim)}
.unit{border-radius:10px; margin:3px 0; overflow:hidden; background:transparent}
.unit>.uhead{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:10px;
  cursor:pointer; transition:background .18s; user-select:none;
}
.unit>.uhead:hover{background:#182338}
.unit.active>.uhead{background:#182338}
.uhead .ui{width:24px; height:24px; flex:0 0 24px; border-radius:7px; display:grid; place-items:center; font-size:12px; font-weight:700; background:#1d2b45; color:var(--cyan)}
.uhead .ut{flex:1; min-width:0; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.uhead .uc{font-size:10px; color:var(--dim)}
.ubar{height:4px; border-radius:3px; background:#22304a; margin:0 10px 4px; overflow:hidden}
.ubar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); transition:width .4s}
.lessons{display:none; padding:2px 6px 8px 10px}
.unit.open .lessons{display:block}
.lrow{
  display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer;
  font-size:12.5px; color:var(--mut); transition:background .15s,color .15s;
}
.lrow:hover{background:#182338; color:var(--txt)}
.lrow.active{background:#12314a; color:var(--cyan)}
.lrow .dot{width:16px; height:16px; flex:0 0 16px; border-radius:50%; border:1.5px solid #33456a; display:grid; place-items:center; font-size:9px}
.lrow.done .dot{background:var(--ok); border-color:var(--ok); color:#07281c}
.special .uhead .ui{background:#2a1f45; color:var(--purple)}

/* top progress */
.topbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px}
.gprog{flex:1; min-width:180px}
.gprog .lab{display:flex; justify-content:space-between; font-size:12px; color:var(--mut); margin-bottom:5px}
.gbar{height:9px; border-radius:6px; background:#1a2540; overflow:hidden}
.gbar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--purple)); transition:width .5s}
.streak{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; font-size:13px; font-weight:600; white-space:nowrap}
.streak b{color:var(--warn)}
#hamb{display:none}

.searchbox{position:relative; margin-bottom:12px}
.searchbox input{width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:9px 12px; font-size:13px; outline:none}
.searchbox input:focus{border-color:var(--cyan)}
.sresults{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--card); border:1px solid var(--line); border-radius:10px; max-height:320px; overflow-y:auto; z-index:40; box-shadow:var(--shadow); display:none}
.sresults.on{display:block}
.sresults .si{padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid #1b263e; display:flex; gap:8px; align-items:baseline}
.sresults .si:hover{background:#182338}
.sresults .si b{color:var(--cyan)}
.sresults .si .m{color:var(--mut); font-size:12px}
.sresults .si .l{margin-left:auto; color:var(--dim); font-size:11px}

/* Cards & content */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; margin:14px 0; box-shadow:var(--shadow)}
h1{font-size:clamp(20px,3.4vw,27px); margin:.2em 0 .1em; line-height:1.2}
h2{font-size:18px; margin:.4em 0}
h3{font-size:15px; margin:1.1em 0 .4em; color:var(--cyan); letter-spacing:.2px}
p{margin:.5em 0}
.goal{background:linear-gradient(135deg,#12314a,#1a1440); border:1px solid #2b4a6a; border-radius:12px; padding:12px 16px; font-size:15px; display:flex; gap:10px; align-items:center}
.goal .t{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--cyan); font-weight:700}
.goal b{color:#fff}
.crumbs{font-size:12px; color:var(--dim); margin-bottom:4px}

/* pronunciation element */
.pw{display:inline-flex; flex-direction:column; align-items:flex-start; gap:1px; vertical-align:top; margin:2px 10px 2px 0}
.pw .fr{color:var(--cyan); font-weight:700; font-size:19px; line-height:1.1}
.pw .rd{color:var(--purple); font-size:13px}
.pw .ip{color:var(--dim); font-size:11px}
.pw.big .fr{font-size:26px}
.pwline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:6px 0}
.spk{background:#1c2b45; border:1px solid #2a3d5e; color:var(--cyan); border-radius:8px; width:32px; height:32px; flex:0 0 32px; display:grid; place-items:center; font-size:15px; transition:transform .15s,background .15s}
.spk:hover{background:#254268; transform:translateY(-1px)}
.spk:active{transform:scale(.9)}
.spk.sm{width:26px; height:26px; font-size:13px; flex-basis:26px}
.mean{color:var(--mut); font-size:14px}
.liaison{color:var(--cyan); text-decoration:underline}
.silent{color:var(--dim)}
.drop{color:#4a5a75}

/* tables */
table{border-collapse:collapse; width:100%; margin:10px 0; font-size:14px}
th,td{border:1px solid var(--line); padding:7px 10px; text-align:left}
th{background:#182338; color:var(--cyan); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.5px}
td .rd{color:var(--purple); font-family:"SF Mono",monospace; font-size:12.5px}
.formula{background:#0e1626; border:1px dashed #33456a; border-radius:10px; padding:12px 16px; font-size:16px; text-align:center; margin:10px 0; letter-spacing:.3px}
.formula b{color:var(--cyan)}

/* callout boxes */
.box{border-radius:12px; padding:12px 16px; margin:12px 0; border:1px solid; font-size:14px}
.box .bt{font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; display:inline-block; margin-bottom:4px}
.box.exc{background:#2a1414; border-color:#5a2a2a} .box.exc .bt{color:var(--bad)}
.box.pron{background:#12233a; border-color:#26507a} .box.pron .bt{color:var(--cyan)}
.box.eng{background:#16233a; border-color:#33456a} .box.eng .bt{color:var(--purple)}
.box.faux{background:#2a2410; border-color:#6a5a1a} .box.faux .bt{color:var(--warn)}
.box.note{background:#12233a; border-color:#26507a} .box.note .bt{color:var(--cyan)}

/* discovery */
.disc-ex{background:#0e1626; border-radius:10px; padding:12px 16px; margin:8px 0}
.reveal{margin-top:10px}
.reveal .q{color:var(--purple); font-weight:600}
.reveal .ans{display:none; margin-top:8px; padding:10px 14px; background:#12233a; border-left:3px solid var(--cyan); border-radius:8px}
.reveal.open .ans{display:block}

/* steps / stepper */
.stepper{display:flex; gap:6px; margin:16px 0 8px; flex-wrap:wrap}
.stp{flex:1; min-width:60px; text-align:center; font-size:11px; padding:8px 4px; border-radius:9px; background:var(--card); border:1px solid var(--line); color:var(--dim); position:relative}
.stp.cur{border-color:var(--cyan); color:var(--cyan); background:#12233a}
.stp.done{color:var(--ok); border-color:#245}
.stp b{display:block; font-size:16px}

/* quiz */
.quiz{margin:6px 0}
.qnum{font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase}
.qq{font-size:16px; margin:6px 0 12px; font-weight:500}
.opts{display:grid; gap:8px}
.opt{
  text-align:left; background:var(--card2); border:1.5px solid var(--line); color:var(--txt);
  border-radius:10px; padding:11px 14px; font-size:15px; transition:all .15s; display:flex; gap:10px; align-items:center;
}
.opt:hover:not(:disabled){border-color:var(--cyan); transform:translateY(-1px)}
.opt .k{width:22px; height:22px; flex:0 0 22px; border-radius:6px; background:#1d2b45; display:grid; place-items:center; font-size:11px; color:var(--mut)}
.opt.ok{border-color:var(--ok); background:#12291f} .opt.ok .k{background:var(--ok); color:#062}
.opt.bad{border-color:var(--bad); background:#291414} .opt.bad .k{background:var(--bad); color:#400}
.opt:disabled{cursor:default; opacity:.85}
.inp{width:100%; background:var(--card2); border:1.5px solid var(--line); color:var(--txt); border-radius:10px; padding:11px 14px; font-size:16px; outline:none}
.inp:focus{border-color:var(--cyan)}
.inp.ok{border-color:var(--ok)} .inp.bad{border-color:var(--bad)}
.fb{margin-top:12px; border-radius:10px; padding:11px 14px; font-size:14px; display:none}
.fb.on{display:block}
.fb.good{background:#12291f; border:1px solid #245} .fb.good .h{color:var(--ok); font-weight:700}
.fb.wrong{background:#291414; border:1px solid #5a2a2a}
.fb .h{font-weight:700; margin-bottom:3px}
.fb .why{color:var(--mut); margin-top:4px}
.fb .lnk{margin-top:6px; font-size:12.5px}
.wordcmp{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.wc{padding:3px 9px; border-radius:6px; font-size:13px; font-family:monospace}
.wc.g{background:#12291f; color:var(--ok); border:1px solid #245}
.wc.b{background:#291414; color:var(--bad); border:1px solid #5a2a2a}
.wc.m{background:#2a2410; color:var(--warn); border:1px dashed #6a5a1a}

/* match */
.matchwrap{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.mcol{display:grid; gap:8px}
.mitem{background:var(--card2); border:1.5px solid var(--line); border-radius:9px; padding:10px 12px; font-size:14px; cursor:pointer; transition:all .15s}
.mitem:hover{border-color:var(--cyan)}
.mitem.sel{border-color:var(--purple); background:#1a1440}
.mitem.done{border-color:var(--ok); background:#12291f; cursor:default; opacity:.7}
.mitem.err{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* order (build sentence) */
.bank,.slot{display:flex; flex-wrap:wrap; gap:8px; min-height:46px; padding:8px; border-radius:10px}
.slot{background:#0e1626; border:1.5px dashed #33456a; margin-bottom:8px}
.bank{background:transparent}
.tok{background:#1c2b45; border:1.5px solid #2a3d5e; color:var(--cyan); border-radius:8px; padding:7px 12px; font-size:15px; cursor:pointer; transition:transform .12s}
.tok:hover{transform:translateY(-2px); border-color:var(--cyan)}

/* buttons */
.btn{background:linear-gradient(135deg,var(--cyan),#3ab0d6); color:#04222b; border:none; border-radius:11px; padding:12px 22px; font-size:15px; font-weight:700; transition:transform .15s,box-shadow .15s; box-shadow:0 6px 16px rgba(34,211,238,.22)}
.btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(34,211,238,.32)}
.btn:disabled{opacity:.4; transform:none; box-shadow:none; cursor:not-allowed}
.btn.ghost{background:transparent; border:1.5px solid var(--line); color:var(--txt); box-shadow:none}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.purple{background:linear-gradient(135deg,var(--purple),#8b6ee0); color:#160b33; box-shadow:0 6px 16px rgba(167,139,250,.22)}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; align-items:center}
.hint{color:var(--dim); font-size:12.5px}

/* summary */
.stat{display:flex; gap:14px; flex-wrap:wrap; margin:12px 0}
.statc{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px 18px; text-align:center; flex:1; min-width:110px}
.statc b{display:block; font-size:28px; color:var(--cyan)}
.statc span{font-size:12px; color:var(--mut)}
.tick{color:var(--ok); font-weight:700}
.learned li{margin:3px 0}

/* floating buttons */
.fabs{position:fixed; right:18px; bottom:18px; display:flex; flex-direction:column; gap:10px; z-index:50}
.fab{background:var(--card); border:1px solid var(--line); color:var(--cyan); border-radius:14px; padding:11px 16px; font-size:13px; font-weight:600; box-shadow:var(--shadow); display:flex; gap:8px; align-items:center; transition:transform .15s}
.fab:hover{transform:translateY(-2px); border-color:var(--cyan)}
.fab.p{color:var(--purple)}

/* modal */
.modal{position:fixed; inset:0; background:rgba(4,8,16,.72); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:30px 14px; overflow-y:auto}
.modal.on{display:flex}
.modal .sheet{background:var(--card); border:1px solid var(--line); border-radius:16px; max-width:760px; width:100%; padding:22px 24px; box-shadow:var(--shadow)}
.modal .x{float:right; background:transparent; border:none; color:var(--mut); font-size:24px; line-height:1}
.kbd{display:inline-block; background:#0e1626; border:1px solid #33456a; border-bottom-width:2px; border-radius:6px; padding:1px 7px; font-family:monospace; font-size:12px; color:var(--txt)}

/* dialogue */
.dline{display:flex; gap:10px; align-items:flex-start; padding:9px 12px; border-radius:10px; margin:6px 0; background:var(--card2); border:1px solid var(--line); cursor:pointer; transition:background .15s}
.dline:hover{background:#182338}
.dline .who{flex:0 0 74px; font-size:12px; font-weight:700; color:var(--purple)}
.dline.b .who{color:var(--cyan)}
.dline .txt .fr{color:var(--cyan); font-weight:600}
.dline .txt .rd{color:var(--purple); font-size:12px; font-family:monospace}
.dline .txt .tr{color:var(--mut); font-size:13px}

.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(80px); background:var(--card); border:1px solid var(--cyan); color:var(--txt); padding:12px 20px; border-radius:12px; box-shadow:var(--shadow); z-index:200; transition:transform .3s; font-size:14px}
.toast.on{transform:translateX(-50%) translateY(0)}

.empty{text-align:center; color:var(--mut); padding:60px 20px}
.badge{display:inline-block; background:#1d2b45; color:var(--cyan); border-radius:6px; padding:1px 8px; font-size:11px; margin-left:6px}
.hpool .hw{display:flex; justify-content:space-between; align-items:center; padding:9px 12px; background:var(--card2); border:1px solid var(--line); border-radius:10px; margin:6px 0}
.hpool .hw .n{font-size:10px; color:var(--bad); background:#291414; border-radius:5px; padding:1px 7px}

@media(max-width:860px){
  #sidebar{position:fixed; left:0; top:0; z-index:80; transform:translateX(-100%); transition:transform .25s; box-shadow:var(--shadow)}
  #sidebar.open{transform:translateX(0)}
  #hamb{display:grid; place-items:center; width:42px; height:42px; border-radius:11px; background:var(--card); border:1px solid var(--line); color:var(--cyan); font-size:20px}
  #main{padding-top:14px}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:79; display:none}
  .scrim.on{display:block}
}
@media(max-width:480px){
  body{font-size:15px}
  .matchwrap{grid-template-columns:1fr 1fr}
  .card{padding:15px 15px}
  .pw .fr{font-size:17px}
}
</style>

<div id="app">
  <div class="scrim" id="scrim"></div>
  <aside id="sidebar">
    <div class="brand"><span class="fl">🇫🇷</span><div><b>Fransızca A1</b><small>Sıfırdan sisteme • mühendis modu</small></div></div>
    <div class="searchbox">
      <input id="search" placeholder="🔎 Kelime ara (600+)..." autocomplete="off">
      <div class="sresults" id="sresults"></div>
    </div>
    <div class="navsec">Araçlar</div>
    <div class="unit" id="tool-hard"><div class="uhead"><span class="ui">★</span><span class="ut">Zor Kelimeler</span><span class="uc" id="hardcount">0</span></div></div>
    <div class="unit" id="tool-random"><div class="uhead"><span class="ui">🎲</span><span class="ut">Rastgele Test</span><span class="uc">20</span></div></div>
    <div class="navsec">Müfredat</div>
    <div id="unitnav"></div>
  </aside>
  <main id="main">
    <div class="topbar">
      <button id="hamb">☰</button>
      <div class="gprog">
        <div class="lab"><span>Genel İlerleme</span><span id="gptxt">0 / 48 ders</span></div>
        <div class="gbar"><i id="gpbar"></i></div>
      </div>
      <div class="streak">🔥 Seri: <b id="streaknum">0</b></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="fabs">
  <button class="fab" id="fabRuler">📏 Telaffuz Cetveli</button>
</div>

<div class="modal" id="modal"><div class="sheet" id="modalbody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   FRANSIZCA A1 · tek dosya motor
   State sadece JS değişkenlerinde (localStorage yok).
   ========================================================================= */
const UNITS = [];
const V=(fr,rd,ipa,mean)=>({fr,rd,ipa,mean});
const revUnit=id=>()=>unitReviewQuestions(UNITS.find(u=>u.id===id));
const bigRev=id=>()=>bigReviewQuestions(id);
/* ======================= ÜNİTE 0 · Sesler ve İlk Kelimeler ======================= */
UNITS.push({ id:0, title:"Ünite 0 · Sesler ve İlk Kelimeler", lessons:[
{
  id:"0-1", shortTitle:"D1 · Fransız R", title:"D1 · Fransız R sesi + ilk kelimeler",
  goal:"Bu ders sonunda: bonjour, merci, au revoir diyebileceksin.",
  discovery:{
    examples:[ V("bonjour","bo~juĞ","bɔ̃.ʒuʁ","merhaba / iyi günler"), V("merci","meĞsi","mɛʁ.si","teşekkürler"), V("au revoir","o Ğövuağ","o.ʁə.vwaʁ","hoşça kal") ],
    prompt:"Üç kelimede de bir 'Ğ' var. Sence bu 'r' harfini Türkçe r gibi mi okuyoruz?",
    answer:"Hayır. Fransız R'si <b>gırtlaktan</b>, hafif <b>gargara</b> sesi gibi çıkar. Türkçe r gibi dil ucuyla değil, dilin arkası + gırtlakla. Biz onu <b class='mono' style='color:var(--purple)'>Ğ</b> ile gösteriyoruz."
  },
  rule:`<div class="box pron"><span class="bt">Telaffuz Notu · Fransız R (Ğ)</span>
    Gargara yapar gibi, gırtlağının arkasından. Türkçe 'ğ' gibi yumuşak ama sürtünmeli. Zorlanırsan "gh" diye fısılda.</div>
    <div class="pwline"><span class="pw"><span class="fr">bonjour</span><span class="rd mono">(bo~juĞ)</span><span class="ip mono">/bɔ̃.ʒuʁ/</span></span><button class="spk" data-say="bonjour">🔊</button></div>
    <table><tr><th>Fransızca</th><th>Okunuş</th><th>Anlam</th></tr>
    <tr><td>bonjour</td><td class="rd">bo~juĞ</td><td>merhaba</td></tr>
    <tr><td>merci</td><td class="rd">meĞsi</td><td>teşekkürler</td></tr>
    <tr><td>au revoir</td><td class="rd">o Ğövuağ</td><td>hoşça kal</td></tr></table>
    <div class="box eng"><span class="bt">İngilizce köprüsü</span> "merci" ile İngilizce "mercy" aynı kökten. Anlam farklı ama yazım tanıdık.</div>`,
  vocab:[ V("bonjour","bo~juĞ","bɔ̃.ʒuʁ","merhaba"), V("merci","meĞsi","mɛʁ.si","teşekkürler"), V("au revoir","o Ğövuağ","o.ʁə.vwaʁ","hoşça kal"), V("oui","ui","wi","evet"), V("bonsoir","bo~suağ","bɔ̃.swaʁ","iyi akşamlar") ],
  exercises:[

/* ---------------------- STATE ---------------------- */
const S = {
  done:{},            // lessonId -> {score,total}
  hard:{},            // fr -> {word obj, miss, streak}
  streak:0,
  openUnit:null,
  cur:null,           // current lesson id
};

/* ---------------------- HELPERS ---------------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const norm=s=>s.toLowerCase().trim().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.,!?;]/g,'');
const stripAccent=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');

/* all lessons flat + vocab index */
let ALL_LESSONS=[], VOCAB=[], VOCAB_BY_LESSON={};
function indexContent(){
  // Ünite sonu diyalogları ilgili derse bağla
  if(typeof EXTRA_DIALOGUES!=='undefined'){
    Object.keys(EXTRA_DIALOGUES).forEach(id=>{
      for(const u of UNITS){ const f=u.lessons.find(x=>x.id===id); if(f && !f.dialogue){ f.dialogue=EXTRA_DIALOGUES[id]; break; } }
    });
  }
  // Ek kelime paketlerini ilgili derslere kat (her kelime bir derse bağlı kalır)
  if(typeof EXTRA_VOCAB!=='undefined'){
    EXTRA_VOCAB.forEach(pack=>{
      const l=(()=>{ for(const u of UNITS){ const f=u.lessons.find(x=>x.id===pack.lesson); if(f)return f; } return null; })();
      if(l){ l.vocab=(l.vocab||[]); const have=new Set(l.vocab.map(v=>v.fr)); pack.words.forEach(w=>{ if(!have.has(w.fr))l.vocab.push(w); }); }
    });
  }
  ALL_LESSONS=[]; VOCAB=[]; VOCAB_BY_LESSON={};
  UNITS.forEach(u=>u.lessons.forEach(l=>{
    l.unitTitle=u.title; l.unitId=u.id; ALL_LESSONS.push(l);
    (l.vocab||[]).forEach(v=>{ v.lesson=l.id; v.lessonTitle=l.title; VOCAB.push(v); });
    VOCAB_BY_LESSON[l.id]=l.vocab||[];
  }));
  // Telaffuz eşleştirme her derste zorunlu: eksikse dersin kendi kelimesinden üret
  ALL_LESSONS.forEach(l=>{
    if(l.isReview || !l.exercises || !l.exercises.length) return;
    if(l.exercises.some(q=>q.type==='pron')) return;
    const own=(l.vocab||[]).filter(v=>v.rd && !/ /.test(v.fr));
    const src=own.length?own:(l.vocab||[]).filter(v=>v.rd);
    if(!src.length) return;
    const v=src[Math.floor(src.length/2)];
    const pool=VOCAB.filter(x=>x.rd && x.rd!==v.rd);
    const distract=sample(pool,3).map(x=>x.rd);
    if(distract.length<3) return;
    const opts=shuffle([v.rd,...distract]);
    l.exercises.splice(Math.min(4,l.exercises.length),0,{
      type:'pron', qtype:'Telaffuz', fr:v.fr, options:opts, answer:opts.indexOf(v.rd),
      explain:`${v.fr} = (${v.rd}). ${v.mean||''}`, vocab:v
    });
  });
}
const lessonIndex=id=>ALL_LESSONS.findIndex(l=>l.id===id);
const priorVocab=id=>{const i=lessonIndex(id); let v=[]; for(let k=0;k<i;k++) v=v.concat(ALL_LESSONS[k].vocab||[]); return v;};

/* ---------------------- SPEECH ---------------------- */
let VOICE=null, speechOK=('speechSynthesis' in window);
function loadVoice(){ if(!speechOK)return; const vs=speechSynthesis.getVoices(); VOICE=vs.find(v=>/fr[-_]?FR/i.test(v.lang))||vs.find(v=>/^fr/i.test(v.lang))||null; }
if(speechOK){ loadVoice(); speechSynthesis.onvoiceschanged=loadVoice; }
function say(text){
  if(!speechOK){ toast('⚠️ Tarayıcın sesi desteklemiyor'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='fr-FR'; u.rate=.85; if(VOICE)u.voice=VOICE;
  speechSynthesis.speak(u);
}

/* ---------------------- PRONUNCIATION WIDGET ---------------------- */
// reading string may contain markup tokens: we allow raw html for liaison/silent already
function pw(v,big){
  const cls='pw'+(big?' big':'');
  return `<span class="${cls}"><span class="fr">${v.fr}</span><span class="rd mono">(${v.rd})</span>`+
         (v.ipa?`<span class="ip mono">${v.ipa}</span>`:'')+`</span>`;
}
function pwLine(v,big){
  return `<span class="pwline">${pw(v,big)}<button class="spk" title="Dinle (Space)" data-say="${esc(v.fr)}">🔊</button>`+
         (v.mean?`<span class="mean">${v.mean}</span>`:'')+`</span>`;
}
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-say]'); if(s){ say(s.getAttribute('data-say')); }
});

/* ---------------------- TOAST ---------------------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }

/* ---------------------- HARD WORDS POOL ---------------------- */
function missWord(v){ if(!v||!v.fr)return; const k=v.fr; if(!S.hard[k])S.hard[k]={v,miss:0,streak:0}; S.hard[k].miss++; S.hard[k].streak=0; renderHardCount(); }
function goodWord(v){ if(!v||!v.fr)return; const k=v.fr; if(S.hard[k]){ S.hard[k].streak++; if(S.hard[k].streak>=3){ delete S.hard[k]; } renderHardCount(); } }
function renderHardCount(){ const n=Object.keys(S.hard).length; $('#hardcount').textContent=n; }
function hardWords(){ return Object.values(S.hard).map(x=>x.v); }

/* ---------------------- STREAK ---------------------- */
function bumpStreak(ok){ if(ok){S.streak++;} else {S.streak=0;} $('#streaknum').textContent=S.streak; }

/* =========================================================================
   QUIZ ENGINE · renders any quiz object into a container, calls onResult(ok,vocab)
   quiz types: mc, fill, match, order, pron, listen, translate, free
   ========================================================================= */
function backlink(bl){ return bl?`<div class="lnk">↩ <a href="#" data-goto="${esc(bl)}">İlgili derse dön: ${esc(bl)}</a></div>`:''; }
function fbGood(extra){ return `<div class="fb good on"><div class="h">✓ Doğru</div>${extra?`<div class="why">${extra}</div>`:''}</div>`; }
function fbBad(correct,why,bl){ return `<div class="fb wrong on"><div class="h">✕ Doğrusu: <span style="color:var(--cyan)">${correct}</span></div>`+
  (why?`<div class="why">${why}</div>`:'')+backlink(bl)+`</div>`; }

let QID=0;
function renderQuiz(q,box,onResult){
  QID++; const id='q'+QID; box.innerHTML=''; box.className='quiz';
  const v=q.vocab; // optional vocab tag for hard-pool
  const finish=(ok,fbHtml)=>{ box.insertAdjacentHTML('beforeend',fbHtml); bumpStreak(ok); if(ok)goodWord(v); else missWord(v); onResult&&onResult(ok,v); };
  const label=q.qnum!=null?`<div class="qnum">Soru ${q.qnum}${q.qtype?' • '+q.qtype:''}</div>`:'';

  if(q.type==='mc'){
    const opts=q._opts||(q._opts=q.options.map((o,i)=>({o,i})));
    box.innerHTML=label+`<div class="qq">${q.q}</div><div class="opts" id="${id}"></div>`;
    const wrap=$('#'+id,box);
    opts.forEach(({o},i)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<span class="k">${i+1}</span><span>${o}</span>`;
      b.onclick=()=>{
        $$('.opt',wrap).forEach(x=>x.disabled=true);
        const ok=i===q.answer;
        b.classList.add(ok?'ok':'bad');
        if(!ok) wrap.children[q.answer].classList.add('ok');
        finish(ok, ok?fbGood(q.explain):fbBad(q.options[q.answer],q.explain,q.back));
      };
      wrap.appendChild(b);
    });
    box._keys=n=>{ const b=wrap.children[n-1]; if(b&&!b.disabled)b.click(); };
  }

  else if(q.type==='pron'){ // pronunciation match: given fr word, pick reading
    box.innerHTML=label+`<div class="qq">Bu kelime nasıl okunur? <span class="pw"><span class="fr">${q.fr}</span></span> <button class="spk sm" data-say="${esc(q.fr)}">🔊</button></div><div class="opts" id="${id}"></div>`;
    const wrap=$('#'+id,box);
    q.options.forEach((o,i)=>{
      const b=document.createElement('button'); b.className='opt';
      b.innerHTML=`<span class="k">${i+1}</span><span class="rd mono" style="color:var(--purple)">(${o})</span>`;
      b.onclick=()=>{ $$('.opt',wrap).forEach(x=>x.disabled=true); const ok=i===q.answer; b.classList.add(ok?'ok':'bad'); if(!ok)wrap.children[q.answer].classList.add('ok');
        finish(ok, ok?fbGood(q.explain):fbBad('('+q.options[q.answer]+')',q.explain||'Türkçe okunuş standardımıza göre.',q.back)); };
      wrap.appendChild(b);
    });
    box._keys=n=>{ const b=wrap.children[n-1]; if(b&&!b.disabled)b.click(); };
  }

  else if(q.type==='fill'){ // accent-tolerant
    box.innerHTML=label+`<div class="qq">${q.q}</div><input class="inp" id="${id}" placeholder="Cevabını yaz..." autocomplete="off"><div class="btnrow"><button class="btn" id="${id}b">Kontrol Et</button></div>`;
    const inp=$('#'+id,box), sub=()=>{
      const ans=norm(inp.value); const target=norm(q.answer);
      const exact=ans===target;
      const accentless=stripAccent(ans)===stripAccent(target);
      if(exact){ inp.classList.add('ok'); inp.disabled=true; $('#'+id+'b',box).disabled=true; finish(true,fbGood(q.explain)); }
      else if(accentless && ans.length){ inp.classList.add('ok'); inp.disabled=true; $('#'+id+'b',box).disabled=true;
        // accepted but warn
        box.insertAdjacentHTML('beforeend',`<div class="fb good on"><div class="h">✓ Kabul edildi</div><div class="why">⚠️ Aksan eksik: doğrusu <b style="color:var(--cyan)">${q.answer}</b></div></div>`); bumpStreak(true); goodWord(v); onResult&&onResult(true,v); }
      else { inp.classList.add('bad'); inp.disabled=true; $('#'+id+'b',box).disabled=true; finish(false,fbBad(q.answer,q.explain,q.back)); }
    };
    $('#'+id+'b',box).onclick=sub;
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault(); if(!inp.disabled)sub();} });
    box._focus=()=>inp.focus();
  }

  else if(q.type==='listen'){
    box.innerHTML=label+`<div class="qq">🎧 Duyduğun kelimeyi yaz <button class="spk sm" data-say="${esc(q.answer)}">🔊 Tekrar çal</button></div><input class="inp" id="${id}" placeholder="Yaz..." autocomplete="off"><div class="btnrow"><button class="btn" id="${id}b">Kontrol Et</button><span class="hint">Space ile tekrar dinle</span></div>`;
    setTimeout(()=>say(q.answer),250);
    const inp=$('#'+id,box), sub=()=>{ const ok=stripAccent(norm(inp.value))===stripAccent(norm(q.answer)); inp.disabled=true; $('#'+id+'b',box).disabled=true; inp.classList.add(ok?'ok':'bad'); finish(ok, ok?fbGood(q.hint):fbBad(q.answer,q.hint,q.back)); };
    $('#'+id+'b',box).onclick=sub; inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!inp.disabled)sub();}});
    box._replay=()=>say(q.answer); box._focus=()=>inp.focus();
  }

  else if(q.type==='match'){
    const pairs=q.pairs; const L=pairs.map((p,i)=>({t:p[0],i})); const R=shuffle(pairs.map((p,i)=>({t:p[1],i})));
    box.innerHTML=label+`<div class="qq">${q.q||'Eşleştir: tıkla-tıkla'}</div><div class="matchwrap"><div class="mcol" id="${id}L"></div><div class="mcol" id="${id}R"></div></div>`;
    const cl=$('#'+id+'L',box), cr=$('#'+id+'R',box); let sel=null, doneN=0;
    const mk=(item,side)=>{ const d=document.createElement('button'); d.className='mitem'; d.textContent=item.t; d.dataset.i=item.i; d.dataset.side=side;
      d.onclick=()=>{ if(d.classList.contains('done'))return;
        if(!sel){ sel=d; d.classList.add('sel'); return; }
        if(sel.dataset.side===side){ sel.classList.remove('sel'); sel=d; d.classList.add('sel'); return; }
        if(sel.dataset.i===d.dataset.i){ sel.classList.add('done'); d.classList.add('done'); sel.classList.remove('sel'); sel=null; doneN++; bumpStreak(true);
          if(doneN===pairs.length){ box.insertAdjacentHTML('beforeend',fbGood('Hepsini eşleştirdin.')); onResult&&onResult(true,v);} }
        else { const a=sel,b=d; a.classList.add('err'); b.classList.add('err'); setTimeout(()=>{a.classList.remove('err','sel');b.classList.remove('err');},350); sel=null; bumpStreak(false); missWord(v); }
      };
      return d; };
    L.forEach(x=>cl.appendChild(mk(x,'L'))); R.forEach(x=>cr.appendChild(mk(x,'R')));
  }

  else if(q.type==='order'){ // build sentence by clicking tokens
    const toks=shuffle(q.tokens.map((t,i)=>({t,i})));
    box.innerHTML=label+`<div class="qq">${q.q||'Kelimeleri doğru sıraya diz:'} ${q.tr?`<span class="mean">(${q.tr})</span>`:''}</div><div class="slot" id="${id}S"></div><div class="bank" id="${id}B"></div><div class="btnrow"><button class="btn" id="${id}c">Kontrol Et</button><button class="btn ghost" id="${id}r">Temizle</button></div>`;
    const slot=$('#'+id+'S',box), bank=$('#'+id+'B',box); let seq=[];
    const draw=()=>{ bank.innerHTML=''; slot.innerHTML='';
      toks.forEach(o=>{ if(seq.includes(o.i))return; const b=document.createElement('button'); b.className='tok'; b.textContent=o.t; b.onclick=()=>{seq.push(o.i);draw();}; bank.appendChild(b); });
      seq.forEach(i=>{ const o=toks.find(x=>x.i===i); const b=document.createElement('button'); b.className='tok'; b.textContent=o.t; b.onclick=()=>{seq=seq.filter(x=>x!==i);draw();}; slot.appendChild(b); });
    };
    draw();
    $('#'+id+'r',box).onclick=()=>{seq=[];draw();};
    $('#'+id+'c',box).onclick=()=>{
      const got=seq.map(i=>q.tokens[i]).join(' '); const ok=norm(got)===norm(q.answer||q.tokens.join(' '));
      $('#'+id+'c',box).disabled=true; $$('.tok',slot).forEach(t=>t.disabled=true); $$('.tok',bank).forEach(t=>t.disabled=true);
      finish(ok, ok?fbGood(q.explain):fbBad(q.answer||q.tokens.join(' '),q.explain,q.back));
    };
  }

  else if(q.type==='translate'){ // TR->FR word-by-word feedback
    box.innerHTML=label+`<div class="qq">Fransızcaya çevir: <b style="color:var(--txt)">${q.tr}</b></div><input class="inp" id="${id}" placeholder="Fransızca yaz..." autocomplete="off"><div class="btnrow"><button class="btn" id="${id}b">Kontrol Et</button></div>`;
    const inp=$('#'+id,box);
    const sub=()=>{
      const got=norm(inp.value).split(' ').filter(Boolean);
      const want=norm(q.fr).split(' ').filter(Boolean);
      const alts=(q.alt||[]).map(norm);
      const okWhole=norm(inp.value)===norm(q.fr)||alts.includes(norm(inp.value))||stripAccent(norm(inp.value))===stripAccent(norm(q.fr));
      // word-by-word compare
      let cmp='';
      const maxL=Math.max(got.length,want.length);
      for(let i=0;i<maxL;i++){
        const g=got[i], w=want[i];
        if(g&&w&&(g===w)) cmp+=`<span class="wc g">${g}</span>`;
        else if(g&&w&&stripAccent(g)===stripAccent(w)) cmp+=`<span class="wc m">${g} → ${w}</span>`;
        else if(w&&!g) cmp+=`<span class="wc b">eksik: ${w}</span>`;
        else if(g&&!w) cmp+=`<span class="wc b">fazla: ${g}</span>`;
        else cmp+=`<span class="wc b">${g||'·'} → ${w||'·'}</span>`;
      }
      inp.disabled=true; $('#'+id+'b',box).disabled=true; inp.classList.add(okWhole?'ok':'bad');
      if(okWhole){ finish(true, fbGood(`Doğru cümle: <b style="color:var(--cyan)">${q.fr}</b>`)); }
      else { box.insertAdjacentHTML('beforeend', `<div class="fb wrong on"><div class="h">✕ Doğrusu: <span style="color:var(--cyan)">${q.fr}</span></div><div class="why">Kelime kelime karşılaştırma:</div><div class="wordcmp">${cmp}</div>${backlink(q.back)}</div>`); bumpStreak(false); missWord(v); onResult&&onResult(false,v); }
    };
    $('#'+id+'b',box).onclick=sub; inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!inp.disabled)sub();}});
    box._focus=()=>inp.focus();
  }

  else if(q.type==='free'){ // pattern free production
    box.innerHTML=label+`<div class="qq">✍️ Kendi cümleni kur: ${q.desc}</div>`+
      (q.example?`<div class="hint" style="margin-bottom:8px">Örnek: <span style="color:var(--cyan)">${q.example}</span></div>`:'')+
      `<input class="inp" id="${id}" placeholder="Cümleni yaz..." autocomplete="off"><div class="btnrow"><button class="btn" id="${id}b">Kontrol Et</button></div>`;
    const inp=$('#'+id,box);
    const sub=()=>{
      const txt=norm(inp.value); const need=(q.keywords||[]).map(norm);
      const missing=need.filter(k=>!txt.includes(k));
      inp.disabled=true; $('#'+id+'b',box).disabled=true;
      if(!txt){ inp.classList.add('bad'); box.insertAdjacentHTML('beforeend',`<div class="fb wrong on"><div class="h">Boş bırakma</div><div class="why">${q.hint||'Kalıbı kullanarak bir cümle yaz.'}</div></div>`); onResult&&onResult(true,v); return; }
      if(missing.length===0){ inp.classList.add('ok'); box.insertAdjacentHTML('beforeend',`<div class="fb good on"><div class="h">✓ Kalıba uygun</div><div class="why">${q.ok||'Kalıbı doğru kullandın. Söyleyip pekiştir.'} <button class="spk sm" data-say="${esc(inp.value)}">🔊 kendi cümleni dinle</button></div></div>`); goodWord(v); }
      else { inp.classList.add('bad'); box.insertAdjacentHTML('beforeend',`<div class="fb wrong on"><div class="h">Kalıp eksik</div><div class="why">Şu parça(lar) eksik görünüyor: <b style="color:var(--warn)">${missing.join(', ')}</b>. ${q.hint||''}</div></div>`); }
      bumpStreak(missing.length===0); onResult&&onResult(true,v); // free always advances
    };
    $('#'+id+'b',box).onclick=sub; inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(!inp.disabled)sub();}});
    box._focus=()=>inp.focus();
  }

  else { box.innerHTML='<div class="hint">Bilinmeyen soru tipi.</div>'; onResult&&onResult(true); }
  return box;
}

/* =========================================================================
   AUTO-GENERATORS: warmup, unit review, big review, random test
   ========================================================================= */
function genWarmup(lessonId){
  // pull from prior vocab + hard pool, 3 questions
  let pool=priorVocab(lessonId);
  const hp=hardWords();
  pool=hp.concat(pool);
  pool=pool.filter(v=>v && v.mean);
  if(pool.length<4) return null;
  const picks=[]; const seen=new Set();
  for(const v of pool){ if(seen.has(v.fr))continue; seen.add(v.fr); picks.push(v); if(picks.length>=3)break; }
  return picks.map((v,idx)=>vocabToMC(v,pool,idx+1,'Isınma'));
}
function vocabToMC(v,pool,num,tag){
  const distract=sample(pool.filter(x=>x.fr!==v.fr && x.mean),3).map(x=>x.mean);
  const opts=shuffle([v.mean,...distract]);
  return {type:'mc', qnum:num, qtype:tag, q:`<span class="pw"><span class="fr">${v.fr}</span></span> ne demek? <button class="spk sm" data-say="${esc(v.fr)}">🔊</button>`, options:opts, answer:opts.indexOf(v.mean), explain:`${v.fr} = ${v.mean}`, vocab:v, back:v.lessonTitle};
}
function vocabToPron(v,num){ // needs rd
  const pool=VOCAB.filter(x=>x.rd&&x.fr!==v.fr);
  const distract=sample(pool,3).map(x=>x.rd);
  const opts=shuffle([v.rd,...distract]);
  return {type:'pron', qnum:num, qtype:'Telaffuz', fr:v.fr, options:opts, answer:opts.indexOf(v.rd), vocab:v};
}
function unitReviewQuestions(unit){
  const vs=[]; unit.lessons.forEach(l=>(l.vocab||[]).forEach(v=>vs.push(v)));
  const uniq=[]; const seen=new Set(); vs.forEach(v=>{if(!seen.has(v.fr)){seen.add(v.fr);uniq.push(v);}});
  const qs=[]; const chosen=sample(uniq,Math.min(15,uniq.length));
  chosen.forEach((v,i)=>{
    if(i%3===2 && v.rd) qs.push(vocabToPron(v,i+1));
    else if(i%3===1 && v.mean) qs.push({type:'translate', qnum:i+1, qtype:'Üretim', tr:v.mean, fr:v.fr, back:v.lessonTitle});
    else qs.push(vocabToMC(v,uniq,i+1,'Karma'));
  });
  return qs;
}
function bigReviewQuestions(uptoUnitId){
  const vs=[]; UNITS.filter(u=>u.id<=uptoUnitId && !u.special).forEach(u=>u.lessons.forEach(l=>(l.vocab||[]).forEach(v=>vs.push(v))));
  const uniq=[]; const seen=new Set(); vs.forEach(v=>{if(!seen.has(v.fr)){seen.add(v.fr);uniq.push(v);}});
  const chosen=sample(uniq,Math.min(25,uniq.length));
  return chosen.map((v,i)=>{ if(i%4===0&&v.rd)return vocabToPron(v,i+1); if(i%4===1)return {type:'translate',qnum:i+1,qtype:'Üretim',tr:v.mean,fr:v.fr,back:v.lessonTitle}; return vocabToMC(v,uniq,i+1,'Büyük Tekrar'); });
}
function randomTestQuestions(){
  const doneIds=Object.keys(S.done);
  let vs=[]; ALL_LESSONS.forEach(l=>{ if(doneIds.includes(l.id)) vs=vs.concat(l.vocab||[]); });
  if(vs.length<6) vs=VOCAB.slice(0,40);
  const uniq=[]; const seen=new Set(); vs.forEach(v=>{if(!seen.has(v.fr)){seen.add(v.fr);uniq.push(v);}});
  const chosen=sample(uniq,Math.min(20,uniq.length));
  return chosen.map((v,i)=>{ const r=i%3; if(r===0&&v.rd)return vocabToPron(v,i+1); if(r===1)return {type:'translate',qnum:i+1,qtype:'Üretim',tr:v.mean,fr:v.fr,back:v.lessonTitle}; return vocabToMC(v,uniq,i+1,'Rastgele'); });
}

let LS=null; // lesson session
function openLesson(id){
  const l=ALL_LESSONS.find(x=>x.id===id); if(!l)return;
  S.cur=id;
  // build step list dynamically
  const steps=[];
  const wu=l.warmup||genWarmup(id);
  if(wu&&wu.length) steps.push({key:'warm',name:'Isınma',icon:'🔥',data:wu});
  if(l.discovery) steps.push({key:'disc',name:'Keşif',icon:'🔍'});
  if(l.rule) steps.push({key:'rule',name:'Kural',icon:'📐'});
  if(l.exercises&&l.exercises.length) steps.push({key:'ex',name:'Alıştırma',icon:'✏️'});
  if(l.production) steps.push({key:'prod',name:'Üretim',icon:'🗣️'});
  if(l.dialogue) steps.push({key:'dia',name:'Diyalog',icon:'💬'});
  if(l.review) steps.push({key:'rev',name:l.reviewTitle||'Karma Test',icon:'🧩',data:l.review()});
  steps.push({key:'sum',name:'Özet',icon:'🏁'});
  LS={l,steps,idx:0,score:0,attempts:0,missed:[],sentences:0};
  renderStep();
}
function stepBox(){ return $('#stepbox'); }
function renderStep(){
  const {l,steps,idx}=LS; const st=steps[idx];
  const stepper=steps.map((s,i)=>`<div class="stp ${i===idx?'cur':''} ${i<idx?'done':''}"><b>${s.icon}</b>${s.name}</div>`).join('');
  const i=lessonIndex(l.id); const uNum=l.unitId;
  let html=`<div class="crumbs">${esc(l.unitTitle)}</div>`+
    `<h1>${esc(l.title)}</h1>`+
    (l.goal?`<div class="goal"><span class="t">Hedef</span> <span><b>${esc(l.goal)}</b></span></div>`:'')+
    `<div class="stepper">${stepper}</div>`+
    `<div id="stepbox"></div>`;
  $('#view').innerHTML=html;
  renderNav();
  const box=stepBox();
  if(st.key==='warm') renderQuizStep(box,st.data,'Önceki derslerden hızlı ısınma. 3 soruyu geçince derse hazırsın.',true);
  else if(st.key==='disc') renderDiscovery(box,l);
  else if(st.key==='rule') renderRule(box,l);
  else if(st.key==='ex') renderQuizStep(box,l.exercises,'Kolaydan zora. Son sorular üretim.');
  else if(st.key==='prod') renderProduction(box,l);
  else if(st.key==='dia') renderDialogue(box,l);
  else if(st.key==='rev') renderQuizStep(box,st.data,l.reviewIntro||'Bu ünitenin tamamından karma test.');
  else if(st.key==='sum') renderSummary(box,l);
  window.scrollTo({top:0,behavior:'smooth'});
}
function nextStep(){ if(LS.idx<LS.steps.length-1){LS.idx++; renderStep();} }

function stepNextBtn(box,label,enabled){
  const row=document.createElement('div'); row.className='btnrow';
  const b=document.createElement('button'); b.className='btn'; b.textContent=label||'Devam →'; b.disabled=!enabled; b.onclick=nextStep;
  row.appendChild(b); box.appendChild(row); return b;
}

/* --- warmup / exercises / review: sequential quiz runner --- */
function renderQuizStep(box,quizzes,intro,isWarm){
  box.innerHTML=`<div class="card"><p class="hint">${intro||''}</p><div id="qhost"></div><div id="qnav" class="btnrow"></div></div>`;
  let i=0; const host=$('#qhost',box), nav=$('#qnav',box);
  const run=()=>{
    if(i>=quizzes.length){
      nav.innerHTML='';
      const b=document.createElement('button'); b.className='btn';
      b.textContent=isWarm?'Hazırsın → Derse başla':'Devam →'; b.onclick=nextStep; nav.appendChild(b);
      if(isWarm) host.insertAdjacentHTML('beforeend','<div class="fb good on" style="margin-top:14px"><div class="h">✓ Hazırsın!</div><div class="why">Isınma tamam. Şimdi yeni konuya geçiyoruz.</div></div>');
      return;
    }
    const qb=document.createElement('div'); host.innerHTML=''; host.appendChild(qb);
    const q=Object.assign({},quizzes[i]); if(q.qnum==null)q.qnum=i+1;
    nav.innerHTML='';
    renderQuiz(q,qb,(ok)=>{
      if(!isWarm){ LS.attempts++; if(ok)LS.score++; else if(q.vocab)LS.missed.push(q.vocab); }
      const nb=document.createElement('button'); nb.className='btn'; nb.textContent=(i===quizzes.length-1)?(isWarm?'Bitir →':'Sonuç →'):'Sonraki soru →';
      nb.onclick=()=>{ i++; run(); }; nav.appendChild(nb); nb.focus();
    });
    window._activeQuizBox=qb;
  };
  run();
}

function initSearch(){
  const inp=$('#search'), res=$('#sresults');
  inp.addEventListener('input',()=>{
    const q=norm(inp.value); if(!q){res.classList.remove('on');res.innerHTML='';return;}
    const hits=VOCAB.filter(v=>norm(v.fr).includes(q)||(v.mean&&norm(v.mean).includes(q))||(v.rd&&norm(v.rd).includes(q))).slice(0,30);
    if(!hits.length){res.innerHTML='<div class="si"><span class="m">Sonuç yok</span></div>';res.classList.add('on');return;}
    res.innerHTML=hits.map(v=>`<div class="si" data-lesson="${v.lesson}"><b>${v.fr}</b> <span class="m">${v.mean||''}</span> <span class="l">${esc(v.lessonTitle||'')}</span></div>`).join('');
    res.classList.add('on');
    $$('.si',res).forEach(s=>{ if(s.dataset.lesson) s.onclick=()=>{ res.classList.remove('on'); inp.value=''; openLesson(s.dataset.lesson); closeSidebar(); }; });
  });
  document.addEventListener('click',e=>{ if(!e.target.closest('.searchbox')) res.classList.remove('on'); });
}

/* =========================================================================
   PRONUNCIATION RULER MODAL
   ========================================================================= */
const RULER=[
  ['an, en','a~','nazal (burun); dilin ucu boşta, hava burundan','sans, en'],
  ['on, om','o~','yuvarlak dudak, burundan','bon, nom'],
  ['in, ain, ein, im','e~','geniş "e", burundan','vin, pain, plein'],
  ['un, um','ö~','"ö" gibi, burundan','un, brun'],
  ['ou','u','Türkçe u','vous, nous'],
  ['u','ü','Türkçe ü (dudak yuvarlak, dil önde)','tu, rue'],
  ['eu, œu','ö','Türkçe ö','deux, peur'],
  ['é','e','kapalı, net "e"','café, été'],
  ['è, ê, ai, ei','e (açık)','geniş açık "e"','très, mère, mais'],
  ['e (sonda)','(düşer)','çoğu zaman okunmaz: p(ö)ti','petit, table'],
  ['r','Ğ','gırtlaktan, gargara sesi','rouge, Paris'],
  ['oi','ua','sabit kural','trois, moi, toi'],
  ['au, eau','o','uzun kapalı o','beau, eau'],
  ['ch','ş','Türkçe ş','chat, chien'],
  ['gn','ny','İtalyanca gnocchi gibi','montagne'],
  ['j, ge/gi','j','Türkçe j','je, rouge'],
  ['ll (i sonrası)','y','fille = (fiy)','fille, famille'],
  ['h','(sessiz)','asla okunmaz','heure, homme'],
  ['ç','s','her zaman s','ça, français'],
  ['qu','k','her zaman k','qui, quatre'],
  ['son sessizler','(düşer)','okunmaz (CaReFuL istisna)','Pari(s), peti(t)'],
  ['liaison','_ bağ','okunmayan son sessiz, sesliye bağlanır','vous_avez → (vuzave)'],
];
function openRuler(){
  const rows=RULER.map(r=>`<tr><td class="mono" style="color:var(--cyan)">${r[0]}</td><td class="mono" style="color:var(--purple)">${r[1]}</td><td>${r[2]}</td><td class="mono" style="color:var(--dim)">${r[3]}</td></tr>`).join('');
  openModal(`<h2>📏 Telaffuz Cetveli</h2><p class="hint">İstediğin an bak. Türkçe okunuş standardımızın tam listesi.</p>
    <div style="overflow-x:auto"><table><tr><th>Yazım</th><th>Okunuş</th><th>Nasıl</th><th>Örnek</th></tr>${rows}</table></div>
    <div class="box eng" style="margin-top:12px"><span class="bt">Hatırlatma</span> Burun sesleri <b>~</b> ile: a~ / o~ / e~ / ö~. Fransız R = <b>Ğ</b> (gargara). Düşen e soluk gösterilir: p(ö)ti. Liaison cyan alt çizgi.</div>`);
}
function openModal(html){ $('#modalbody').innerHTML=`<button class="x" onclick="closeModal()">×</button>`+html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal')closeModal(); });

/* =========================================================================
   SIDEBAR (mobile)
   ========================================================================= */
function openSidebar(){ $('#sidebar').classList.add('open'); $('#scrim').classList.add('on'); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }

/* =========================================================================
   KEYBOARD SHORTCUTS: 1-4 option, Enter, Space=say
   ========================================================================= */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){ return; }
  if(e.key===' '){ // play the most recent audio button in active box
    const box=window._activeQuizBox||stepBox()||document; const s=box.querySelector('[data-say]'); if(s){ e.preventDefault(); say(s.getAttribute('data-say')); } return; }
  if(['1','2','3','4'].includes(e.key)){ const box=window._activeQuizBox||stepBox(); if(box&&box._keys){ box._keys(+e.key); } }
});

/* =========================================================================
   GLOBAL LINK HANDLER (backlinks -> jump to lesson by title)
   ========================================================================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-goto]'); if(g){ e.preventDefault(); const t=g.getAttribute('data-goto'); const l=ALL_LESSONS.find(x=>x.title===t||x.shortTitle===t||(x.title&&x.title.includes(t))); if(l){openLesson(l.id);closeSidebar();} else toast('İlgili ders: '+t); }
});

/* =========================================================================
   INIT
   ========================================================================= */
function init(){
  indexContent();
  renderNav();
  renderHardCount();
  initSearch();
  $('#hamb').onclick=openSidebar;
  $('#scrim').onclick=closeSidebar;
  $('#fabRuler').onclick=openRuler;
  $('#tool-hard').querySelector('.uhead').onclick=()=>{openHard();closeSidebar();};
  $('#tool-random').querySelector('.uhead').onclick=()=>{openRandom();closeSidebar();};
  // welcome / open first lesson

  renderWelcome();
}

if(document.readyState!=='loading')init();
